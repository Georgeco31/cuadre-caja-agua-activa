services:
  api:
    build:
      context: ./apps/api
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Cuadre de Caja Agua Activa}
      API_SERVICE_NAME: ${API_SERVICE_NAME:-cuadre-caja-api}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cuadre_user:cuadre_password@db:5432/cuadre_caja}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_IS_ACTIVE: ${ADMIN_IS_ACTIVE:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cuadre_caja}
      POSTGRES_USER: ${POSTGRES_USER:-cuadre_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cuadre_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
